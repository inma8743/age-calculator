<body><header><h1>생일까지 며칠?</h1><p>생일 날짜를 입력하면 올해 또는 다음 생일까지 남은 날짜를 계산합니다.</p></header><main>
<section class="section"><label for="birthday"><strong>생일</strong></label> <input id="birthday" type="date"><div id="result" class="result">생일을 입력하세요.</div></section>
<section class="section"><h2>계산 방식</h2><p>올해 생일이 아직 지나지 않았다면 올해 생일까지, 이미 지났다면 다음 해 생일까지 남은 날짜를 계산합니다. 2월 29일 생일은 윤년이 아닌 해에 2월 28일 기준으로 볼 수 있습니다.</p></section>

</main><footer><a href="/feedback.html">피드백</a> · <a href="/privacy.html">개인정보처리방침</a></footer><script>const b=document.getElementById('birthday'),r=document.getElementById('result');b.addEventListener('change',()=>{const val=b.value;if(!val){r.textContent='생일을 입력하세요.';return}const now=new Date(),p=val.split('-').map(Number);let next=new Date(now.getFullYear(),p[1]-1,p[2]);if(next<new Date(now.getFullYear(),now.getMonth(),now.getDate()))next=new Date(now.getFullYear()+1,p[1]-1,p[2]);const days=Math.round((next-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);r.textContent=days===0?'오늘이 생일입니다.':`생일까지 ${days}일 남았습니다.`})</script></body></html>
